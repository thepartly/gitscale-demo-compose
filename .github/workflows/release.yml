name: release
on:
  push:
    branches: [main]
concurrency: release
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - run: shellcheck -x compose tags && shellcheck -s bash lib.sh
      # The version already on the commit, so a rerun releases it again;
      # else a new one. The major is written here: v1.
      - id: name
        run: |
          V=$(git tag --points-at HEAD 'v1-*' | head -n1)
          [ -n "$V" ] || V="v1-$(date -u +%Y.%m.%d-%H%M%S)"
          echo "release=$V" >> "$GITHUB_OUTPUT"
      - env:
          RELEASE: ${{ steps.name.outputs.release }}
        run: |
          git tag -f "$RELEASE"
          git push origin "refs/tags/$RELEASE"
